name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 10 * * *'  # daily at 10:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keep-alive.yml'

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://hossofghephkcncecesp.supabase.co
          # Public client key; database access remains subject to grants and RLS.
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_gfK8IhVJb_o8ufk1JDzAog_WZxQc2Vo
        run: |
          # Query a real table without changing data or returning row contents.
          # Publishable keys belong in apikey, not a Bearer JWT header.
          curl --fail --show-error --silent --max-time 20 \
            --retry 3 --retry-delay 5 --retry-max-time 90 \
            "$SUPABASE_URL/rest/v1/domains?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -o /dev/null
